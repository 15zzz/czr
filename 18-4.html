<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1012 陈卓然 · ECharts 双图展示</title>
    <script src="cdn/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #071722 0px, #102a35 520px, #0b1a2e 100%);
            color: #e8f1ff;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .czr_wrap { max-width: 1200px; margin: 0 auto; }

        .czr_home {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            color: #e8f1ff;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .czr_home:hover { background: rgba(255, 255, 255, 0.2); transform: translateX(-4px); }

        .czr_title { font-size: 26px; color: #79d6ce; margin-bottom: 6px; font-weight: bold; }
        .czr_sub { font-size: 13px; color: #8fa6c2; margin-bottom: 20px; }

        .czr_grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        @media (max-width: 780px) { .czr_grid { grid-template-columns: 1fr; } }

        .czr_chart_box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px;
            transform-style: preserve-3d;
            animation: czr_card_in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .czr_chart_box:nth-child(2) { animation-delay: 0.15s; }
        @keyframes czr_card_in {
            from { opacity: 0; transform: rotateY(-8deg) translateY(20px) translateZ(-40px); }
            to   { opacity: 1; transform: rotateY(0) translateY(0) translateZ(0); }
        }

        .czr_chart_title {
            font-size: 14px;
            font-weight: bold;
            color: #ffc46b;
            padding-left: 6px;
            border-left: 3px solid #ffc46b;
            margin-bottom: 10px;
        }

        .czr_chart { width: 100%; height: 380px; }

        .czr_footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #6c83a0;
        }
    </style>
</head>
<body>
<!-- 姓名：陈卓然，日期：2026-11-05，功能名称：ECharts 两图（堆叠折线 + 环形饼图） -->

<a href="index.html" class="czr_home">← 返回首页</a>

<div class="czr_wrap">
    <h1 class="czr_title">ECharts 数据可视化</h1>
    <p class="czr_sub">本页通过本地 <code style="color:#79d6ce;">cdn/echarts.min.js</code> 引入 ECharts，展示官方示例 line-stack（堆叠折线）与 pie-doughnut（环形饼图）。</p>

    <div class="czr_grid">
        <div class="czr_chart_box">
            <div class="czr_chart_title">① Stacked Line — 堆叠折线图（官方示例 line-stack）</div>
            <div class="czr_chart" id="czr_chart1"></div>
        </div>
        <div class="czr_chart_box">
            <div class="czr_chart_title">② Pie Doughnut — 环形饼图（官方示例 pie-doughnut）</div>
            <div class="czr_chart" id="czr_chart2"></div>
        </div>
    </div>

    <p class="czr_footer">陈卓然 · 1012 · 18-4.html · ECharts 双图</p>
</div>

<script>
    // ========== 图表 1：堆叠折线图 (line-stack) ==========
    var czr_chart1 = echarts.init(document.getElementById('czr_chart1'), null, { renderer: 'canvas' });
    czr_chart1.setOption({
        title: {
            text: 'Stacked Line',
            left: 'center',
            top: 0,
            textStyle: { color: '#e8f1ff', fontSize: 14, fontWeight: 'normal' }
        },
        tooltip: {
            trigger: 'axis',
            backgroundColor: '#0b1a2e',
            borderColor: '#4ca9d9',
            textStyle: { color: '#e8f1ff' }
        },
        legend: {
            top: 28,
            textStyle: { color: '#b8c9dd' },
            data: ['Email', 'Union Ads', 'Video Ads', 'Direct', 'Search Engine']
        },
        grid: {
            left: '3%',
            right: '4%',
            bottom: '3%',
            top: 70,
            containLabel: true
        },
        toolbox: {
            feature: { saveAsImage: {} },
            iconStyle: { borderColor: '#b8c9dd' }
        },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            axisLine: { lineStyle: { color: '#4ca9d9' } },
            axisLabel: { color: '#b8c9dd' }
        },
        yAxis: {
            type: 'value',
            axisLine: { show: false },
            axisLabel: { color: '#b8c9dd' },
            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } }
        },
        color: ['#79d6ce', '#ffc46b', '#ff8a65', '#b08cff', '#4ca9d9'],
        series: [
            {
                name: 'Email',
                type: 'line',
                stack: 'Total',
                areaStyle: { opacity: 0.3 },
                emphasis: { focus: 'series' },
                data: [120, 132, 101, 134, 90, 230, 210]
            },
            {
                name: 'Union Ads',
                type: 'line',
                stack: 'Total',
                areaStyle: { opacity: 0.3 },
                emphasis: { focus: 'series' },
                data: [220, 182, 191, 234, 290, 330, 310]
            },
            {
                name: 'Video Ads',
                type: 'line',
                stack: 'Total',
                areaStyle: { opacity: 0.3 },
                emphasis: { focus: 'series' },
                data: [150, 232, 201, 154, 190, 330, 410]
            },
            {
                name: 'Direct',
                type: 'line',
                stack: 'Total',
                areaStyle: { opacity: 0.3 },
                emphasis: { focus: 'series' },
                data: [320, 332, 301, 334, 390, 330, 320]
            },
            {
                name: 'Search Engine',
                type: 'line',
                stack: 'Total',
                areaStyle: { opacity: 0.3 },
                emphasis: { focus: 'series' },
                data: [820, 932, 901, 934, 1290, 1330, 1320]
            }
        ]
    });

    // ========== 图表 2：环形饼图 (pie-doughnut) ==========
    var czr_chart2 = echarts.init(document.getElementById('czr_chart2'), null, { renderer: 'canvas' });
    czr_chart2.setOption({
        tooltip: {
            trigger: 'item',
            backgroundColor: '#0b1a2e',
            borderColor: '#ffc46b',
            textStyle: { color: '#e8f1ff' },
            formatter: '{a} <br/>{b}: {c} ({d}%)'
        },
        legend: {
            top: '5%',
            left: 'center',
            textStyle: { color: '#b8c9dd' }
        },
        color: ['#79d6ce', '#4ca9d9', '#ffc46b', '#ff8a65', '#b08cff'],
        series: [
            {
                name: 'Access From',
                type: 'pie',
                radius: ['40%', '70%'],
                center: ['50%', '55%'],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 8,
                    borderColor: '#0b1a2e',
                    borderWidth: 2
                },
                label: {
                    show: false,
                    position: 'center'
                },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: 40,
                        fontWeight: 'bold',
                        color: '#e8f1ff'
                    }
                },
                labelLine: {
                    show: false
                },
                data: [
                    { value: 1048, name: 'Search Engine' },
                    { value: 735,  name: 'Direct' },
                    { value: 580,  name: 'Email' },
                    { value: 484,  name: 'Union Ads' },
                    { value: 300,  name: 'Video Ads' }
                ]
            }
        ]
    });

    // 响应式
    window.addEventListener('resize', function () {
        czr_chart1.resize();
        czr_chart2.resize();
    });
</script>
</body>
</html>
