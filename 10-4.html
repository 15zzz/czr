<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈卓然 - Media Query 布局</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: #f3f4ed;
            color: #1c2a24;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .page {
            width: min(1320px, calc(100% - 48px));
            margin: 0 auto;
            padding: 40px 0;
        }

        .heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 2px solid #1c2a24;
            padding-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .heading p {
            margin: 0;
            color: #607267;
            font-size: 14px;
        }

        .box-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .box {
            display: grid;
            aspect-ratio: 1;
            place-items: center;
            background: #427c69;
            color: #fff;
            font-size: 36px;
            font-weight: 700;
        }

        .box:nth-child(3n + 2) {
            background: #e27750;
        }

        .box:nth-child(3n) {
            background: #d4a72c;
            color: #1c2a24;
        }

        @media (min-width: 320px) and (max-width: 599px) {
            .page {
                width: calc(100% - 32px);
                padding: 24px 0;
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 20px;
            }

            .box-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 600px) and (max-width: 999px) {
            .box-list {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (min-width: 1000px) {
            .box-list {
                grid-template-columns: repeat(8, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="heading">
            <h1>陈卓然</h1>
            <p>Media Query 响应式盒子布局</p>
        </header>
        <section class="box-list" aria-label="八个响应式盒子">
            <div class="box">01</div>
            <div class="box">02</div>
            <div class="box">03</div>
            <div class="box">04</div>
            <div class="box">05</div>
            <div class="box">06</div>
            <div class="box">07</div>
            <div class="box">08</div>
        </section>
    </main>
    <a class="chen_home" href="./index.html" style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-block;padding:10px 18px;border-radius:40px;background:#145a8d;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;font-family:'Microsoft YaHei','PingFang SC',sans-serif;box-shadow:0 8px 18px rgba(0,0,0,0.25);">← 返回首页</a>
</body>
</html>
