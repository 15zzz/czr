<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈卓然 - 幻灯片拓展</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background: #eef2ef;
            color: #17251f;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .showcase {
            width: min(820px, 100%);
        }

        .slideshow {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #26332d;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: photo-fade 12s infinite;
        }

        .slide:nth-child(2) {
            animation-delay: 4s;
        }

        .slide:nth-child(3) {
            animation-delay: 8s;
        }

        .photo-label {
            position: absolute;
            z-index: 1;
            bottom: 24px;
            left: 24px;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.62);
            color: #fff;
        }

        .photo-label strong {
            display: block;
            font-size: 22px;
            font-weight: 600;
        }

        .photo-label span {
            display: block;
            margin-top: 3px;
            font-size: 13px;
        }

        .caption {
            padding: 18px 2px 0;
            border-top: 3px solid #5f9678;
        }

        .caption h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .caption p {
            margin: 6px 0 0;
            color: #66736b;
            font-size: 14px;
        }

        @keyframes photo-fade {
            0%, 100% {
                opacity: 0;
            }
            4%, 30% {
                opacity: 1;
            }
            34% {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide {
                animation: none;
            }

            .slide:first-child {
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .photo-label {
                bottom: 12px;
                left: 12px;
                padding: 9px 13px;
            }

            .photo-label strong {
                font-size: 18px;
            }

            .caption h1 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
<!-- 姓名：陈卓然，日期：2026-10-22，功能名称：CSS 幻灯片拓展动画 -->
    <main class="showcase">
        <div class="slideshow" aria-label="图片幻灯片">
            <img class="slide" src="./img/1.jpg" alt="幻灯片图片一">
            <img class="slide" src="./img/2.jpg" alt="幻灯片图片二">
            <img class="slide" src="./img/3.jpg" alt="幻灯片图片三">
            <div class="photo-label">
                <strong>陈卓然</strong>
            </div>
        </div>
        <section class="caption">
            <h1>CSS Animation 幻灯片</h1>
            <p>三张图片，循环播放</p>
        </section>
    </main>
    <a class="chen_home" href="./index.html" style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-block;padding:10px 18px;border-radius:40px;background:#145a8d;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;font-family:'Microsoft YaHei','PingFang SC',sans-serif;box-shadow:0 8px 18px rgba(0,0,0,0.25);">← 返回首页</a>
</body>
</html>
