<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1012 陈卓然 · Canvas粒子文字动画</title>
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #f4f8ff;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background:
                radial-gradient(circle at 25% 20%, rgba(64, 181, 255, 0.18), transparent 28rem),
                radial-gradient(circle at 75% 80%, rgba(168, 106, 255, 0.16), transparent 30rem),
                #07111f;
        }

        .czr_home {
            position: fixed;
            z-index: 3;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .czr_stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 900px;
        }

        .czr_title {
            position: absolute;
            z-index: 2;
            top: 28px;
            left: 50%;
            margin: 0;
            font-size: clamp(18px, 2vw, 28px);
            letter-spacing: 0.2em;
            text-align: center;
            text-shadow: 0 0 24px rgba(95, 210, 255, 0.5);
            transform: translateX(-50%) rotateX(8deg);
            animation: czr_float3d 3s ease-in-out infinite;
        }

        .czr_canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .czr_tip {
            position: fixed;
            z-index: 2;
            right: 20px;
            bottom: 18px;
            margin: 0;
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
            letter-spacing: 0.08em;
        }

        @keyframes czr_float3d {
            0%, 100% { transform: translateX(-50%) translateZ(0) rotateX(8deg) rotateY(-3deg); }
            50% { transform: translateX(-50%) translateZ(35px) rotateX(-5deg) rotateY(3deg); }
        }
    </style>
</head>
<body>
<!-- 姓名：陈卓然，日期：2026-11-05，功能名称：Canvas粒子文字动画 -->

<a class="czr_home" href="index.html">← 返回首页</a>

<main class="czr_stage">
    <h1 class="czr_title">陈卓然 · PARTICLE CANVAS</h1>
    <canvas id="czr_canvas" class="czr_canvas" aria-label="陈卓然粒子文字动画"></canvas>
    <p class="czr_tip">移动鼠标扰动粒子 · 点击重新聚合</p>
</main>

<script>
    var czr_canvas = document.getElementById("czr_canvas");
    var czr_context = czr_canvas.getContext("2d");
    var czr_particles = [];
    var czr_mouse = { x: -1000, y: -1000, active: false };
    var czr_width = 0;
    var czr_height = 0;
    var czr_pixelRatio = window.devicePixelRatio || 1;

    function czr_resize() {
        czr_pixelRatio = window.devicePixelRatio || 1;
        czr_width = window.innerWidth;
        czr_height = window.innerHeight;
        czr_canvas.width = czr_width * czr_pixelRatio;
        czr_canvas.height = czr_height * czr_pixelRatio;
        czr_canvas.style.width = czr_width + "px";
        czr_canvas.style.height = czr_height + "px";
        czr_context.setTransform(czr_pixelRatio, 0, 0, czr_pixelRatio, 0, 0);
        czr_createTextParticles();
    }

    function czr_createTextParticles() {
        var czr_textCanvas = document.createElement("canvas");
        var czr_textContext = czr_textCanvas.getContext("2d");
        var czr_fontSize = Math.min(czr_width * 0.23, czr_height * 0.32, 260);
        czr_fontSize = Math.max(czr_fontSize, 90);
        czr_textCanvas.width = czr_width;
        czr_textCanvas.height = czr_height;
        czr_textContext.clearRect(0, 0, czr_width, czr_height);
        czr_textContext.font = "bold " + czr_fontSize + "px Microsoft YaHei, sans-serif";
        czr_textContext.textAlign = "center";
        czr_textContext.textBaseline = "middle";
        czr_textContext.fillStyle = "#ffffff";
        czr_textContext.fillText("陈卓然", czr_width / 2, czr_height * 0.52);

        var czr_pixels = czr_textContext.getImageData(0, 0, czr_width, czr_height).data;
        var czr_gap = czr_width < 600 ? 5 : 6;
        var czr_targets = [];

        for (var czr_y = 0; czr_y < czr_height; czr_y += czr_gap) {
            for (var czr_x = 0; czr_x < czr_width; czr_x += czr_gap) {
                if (czr_pixels[(czr_y * czr_width + czr_x) * 4 + 3] > 128) {
                    czr_targets.push({ x: czr_x, y: czr_y });
                }
            }
        }

        for (var czr_index = czr_particles.length - 1; czr_index >= czr_targets.length; czr_index--) {
            czr_particles.pop();
        }

        for (var czr_i = 0; czr_i < czr_targets.length; czr_i++) {
            if (czr_particles[czr_i]) {
                czr_particles[czr_i].tx = czr_targets[czr_i].x;
                czr_particles[czr_i].ty = czr_targets[czr_i].y;
            } else {
                var czr_angle = Math.random() * Math.PI * 2;
                var czr_radius = Math.random() * Math.max(czr_width, czr_height);
                czr_particles.push({
                    x: czr_width / 2 + Math.cos(czr_angle) * czr_radius,
                    y: czr_height / 2 + Math.sin(czr_angle) * czr_radius,
                    tx: czr_targets[czr_i].x,
                    ty: czr_targets[czr_i].y,
                    vx: 0,
                    vy: 0,
                    size: Math.random() * 1.8 + 1,
                    hue: 185 + Math.random() * 65
                });
            }
        }
    }

    function czr_animate() {
        czr_context.fillStyle = "rgba(7, 17, 31, 0.28)";
        czr_context.fillRect(0, 0, czr_width, czr_height);

        for (var czr_i = 0; czr_i < czr_particles.length; czr_i++) {
            var czr_particle = czr_particles[czr_i];
            var czr_dxMouse = czr_particle.x - czr_mouse.x;
            var czr_dyMouse = czr_particle.y - czr_mouse.y;
            var czr_distanceMouse = Math.sqrt(czr_dxMouse * czr_dxMouse + czr_dyMouse * czr_dyMouse);

            if (czr_mouse.active && czr_distanceMouse < 90) {
                var czr_force = (90 - czr_distanceMouse) / 90;
                czr_particle.vx += czr_dxMouse / Math.max(czr_distanceMouse, 1) * czr_force * 4;
                czr_particle.vy += czr_dyMouse / Math.max(czr_distanceMouse, 1) * czr_force * 4;
            }

            czr_particle.vx += (czr_particle.tx - czr_particle.x) * 0.018;
            czr_particle.vy += (czr_particle.ty - czr_particle.y) * 0.018;
            czr_particle.vx *= 0.88;
            czr_particle.vy *= 0.88;
            czr_particle.x += czr_particle.vx;
            czr_particle.y += czr_particle.vy;

            czr_context.beginPath();
            czr_context.fillStyle = "hsla(" + czr_particle.hue + ", 92%, 68%, 0.92)";
            czr_context.arc(czr_particle.x, czr_particle.y, czr_particle.size, 0, Math.PI * 2);
            czr_context.fill();
        }

        requestAnimationFrame(czr_animate);
    }

    window.addEventListener("resize", czr_resize);
    czr_canvas.addEventListener("mousemove", function (czr_event) {
        czr_mouse.x = czr_event.clientX;
        czr_mouse.y = czr_event.clientY;
        czr_mouse.active = true;
    });
    czr_canvas.addEventListener("mouseleave", function () {
        czr_mouse.active = false;
    });
    czr_canvas.addEventListener("click", czr_createTextParticles);

    czr_resize();
    czr_animate();
</script>
</body>
</html>
