<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f6fa;
            padding: 120px 20px; 
            
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 90px;              
        }

        h2 {
            font-family: sans-serif;
            font-size: 72px;        
            font-weight: bold;      
            color: #333;
            letter-spacing: 4.5px;  
        }

        .container {
            display: flex;
            flex-direction: column; 
            gap: 90px;              
            align-items: center;    
        }

        /* [表情] 大格子改成 900x600 的长方形 [表情] */
        .panel {
            width: 900px;           /* 宽度变大 */
            height: 600px;          /* 高度不变 */
            border: 4px solid #666; 
            background-color: #fff;
            display: flex;
            padding: 56.25px;       
        }

        .box {
            border: 4px solid #333; 
        }

        /* ==================== 第 1 个面板 ==================== */
        .panel-1 {
            align-items: center;       
            justify-content: center;   
        }
        .panel-1 .box {
            /* 在长方形里，中间的小方块可以适当大一点 */
            width: 200px;           
            height: 180px;          
            background-color: #ff9a9e; 
        }

        /* ==================== 第 2 个面板 ==================== */
        .panel-2 {
            flex-direction: column;    
            align-items: center;       
            justify-content: center;   
            gap: 56.25px;                          
        }
        .panel-2 .box {
            /* 拉宽一点，适应长方形的横向空间 */
            width: 400px;           
            height: 160px;          
        }
        .panel-2 .box:nth-child(1) {
            background-color: #a1c4fd; 
        }
        .panel-2 .box:nth-child(2) {
            background-color: #c2e9fb; 
        }

        /* ==================== 第 3 个面板 ==================== */
        .panel-3 {
            flex-wrap: wrap;           
            align-content: center;     
            justify-content: center;   
            gap: 45px;                              
        }
        .panel-3 .box {
            /* 调整尺寸，使2x2布局在长方形内更协调 */
            width: 360px;           
            height: 180px;          
        }
        .panel-3 .box:nth-child(1) {
            background-color: #fbc2eb; 
        }
        .panel-3 .box:nth-child(2) {
            background-color: #a6c1ee; 
        }
        .panel-3 .box:nth-child(3) {
            background-color: #fccb90; 
        }
        .panel-3 .box:nth-child(4) {
            background-color: #f6d365; 
        }

        /* ==================== 第 4 个面板 ==================== */
        .panel-4 {
            flex-direction: column;    
            justify-content: center;   
            gap: 45px;                              
        }
        
        .panel-4 .box-top {
            width: 100%;
            height: 180px;        /* 顶部长条稍微降低一点高度 */
            background-color: #a8edea; 
        }

        .panel-4 .bottom-row {
            display: flex;
            width: 100%;
            gap: 45px;                              
        }

        .panel-4 .bottom-row .box {
            flex: 1;                   
            height: 180px;        
        }
        .panel-4 .bottom-row .box:nth-child(1) {
            background-color: #f6d365; 
        }
        .panel-4 .bottom-row .box:nth-child(2) {
            background-color: #fda085; 
        }
    </style>
</head>
<body>
<!-- 姓名：陈卓然，日期：2026-10-22，功能名称：Flex 弹性布局 -->
    <h2>陈卓然 flex</h2>
    
    <div class="container">
        <!-- 面板 1 -->
        <div class="panel panel-1">
            <div class="box"></div>
        </div>

        <!-- 面板 2 -->
        <div class="panel panel-2">
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <!-- 面板 3 -->
        <div class="panel panel-3">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <!-- 面板 4 -->
        <div class="panel panel-4">
            <div class="box box-top"></div>
            <div class="bottom-row">
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    </div>

    <a class="chen_home" href="./index.html" style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-block;padding:10px 18px;border-radius:40px;background:#145a8d;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;font-family:'Microsoft YaHei','PingFang SC',sans-serif;box-shadow:0 8px 18px rgba(0,0,0,0.25);">← 返回首页</a>
</body>
</html>
