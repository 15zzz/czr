<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1012 陈卓然 · Canvas 电商系统架构图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #040a14;
            color: #e8f1ff;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .czr_wrap { max-width: 1200px; margin: 0 auto; }

        .czr_home {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            color: #e8f1ff;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .czr_home:hover { background: rgba(255, 255, 255, 0.2); transform: translateX(-4px); }

        .czr_title { font-size: 26px; color: #79d6ce; margin-bottom: 8px; font-weight: bold; }
        .czr_sub { font-size: 13px; color: #8fa6c2; margin-bottom: 20px; }

        .czr_canvas_box {
            background: #071223;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .czr_canvas_box canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .czr_legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 18px;
            font-size: 12px;
            color: #b8c9dd;
        }
        .czr_legend span { display: inline-flex; align-items: center; gap: 6px; }
        .czr_legend i {
            width: 14px; height: 14px; border-radius: 3px;
            display: inline-block;
        }

        .czr_footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #6c83a0;
        }
    </style>
</head>
<body>
<!-- 姓名：陈卓然，日期：2026-11-05，功能名称：Canvas 电商系统架构图 -->

<a href="index.html" class="czr_home">← 返回首页</a>

<div class="czr_wrap">
    <h1 class="czr_title">电商系统架构图（Canvas 绘制）</h1>
    <p class="czr_sub">基于纯 Canvas 2D 绘制的电商全站系统分层架构，从接入层、业务层、数据层到基础设施层。</p>

    <div class="czr_canvas_box">
        <canvas id="czr_cvs"></canvas>
    </div>

    <div class="czr_legend">
        <span><i style="background:#4ca9d9"></i>接入层</span>
        <span><i style="background:#ffc46b"></i>业务服务层</span>
        <span><i style="background:#79d6ce"></i>数据访问层</span>
        <span><i style="background:#ff8a65"></i>数据存储层</span>
        <span><i style="background:#b08cff"></i>基础设施层</span>
        <span><i style="background:#6c83a0;border:1px dashed #fff"></i>消息队列/链路</span>
    </div>

    <p class="czr_footer">陈卓然 · 1012 · 18-2.html · Canvas 电商架构</p>
</div>

<script>
    var czr_canvas = document.getElementById('czr_cvs');
    var czr_ctx = czr_canvas.getContext('2d');

    var czr_dpr = window.devicePixelRatio || 1;
    var czr_w, czr_h;

    function czr_resize() {
        czr_w = czr_canvas.clientWidth;
        czr_h = Math.max(540, czr_w * 0.72);
        czr_canvas.style.height = czr_h + 'px';
        czr_canvas.width = czr_w * czr_dpr;
        czr_canvas.height = czr_h * czr_dpr;
        czr_ctx.setTransform(czr_dpr, 0, 0, czr_dpr, 0, 0);
        czr_draw();
    }

    // ========== 架构数据 ==========
    var czr_layers = [
        {
            name: '接入层',
            color: '#4ca9d9',
            items: ['CDN', '负载均衡', 'API 网关', 'WAF 防火墙', 'Web 服务']
        },
        {
            name: '业务服务层',
            color: '#ffc46b',
            items: ['用户服务', '商品服务', '订单服务', '支付服务', '营销服务', '搜索服务']
        },
        {
            name: '数据访问层',
            color: '#79d6ce',
            items: ['Redis 缓存', '消息队列', '搜索引擎', '分布式事务']
        },
        {
            name: '数据存储层',
            color: '#ff8a65',
            items: ['MySQL 主从', 'MongoDB', 'ElasticSearch', 'HDFS 数据湖']
        },
        {
            name: '基础设施层',
            color: '#b08cff',
            items: ['Docker / K8s', '监控告警', '日志中心', 'CI/CD', '云服务器']
        }
    ];

    // ========== 绘制 ==========
    function czr_draw() {
        // 背景
        czr_ctx.fillStyle = '#071223';
        czr_ctx.fillRect(0, 0, czr_w, czr_h);

        // 顶部标题
        czr_ctx.fillStyle = '#79d6ce';
        czr_ctx.font = 'bold 16px "Microsoft YaHei", Arial';
        czr_ctx.textAlign = 'center';
        czr_ctx.textBaseline = 'top';
        czr_ctx.fillText('电商全站系统架构图', czr_w / 2, 16);

        czr_ctx.fillStyle = '#6c83a0';
        czr_ctx.font = '11px Consolas, monospace';
        czr_ctx.fillText('Architecture Diagram · 陈卓然', czr_w / 2, 40);

        // 层级布局参数
        var czr_topY = 64;
        var czr_layerH = (czr_h - czr_topY - 40) / czr_layers.length;
        var czr_padX = 24;
        var czr_layerPad = 12;

        for (var czr_i = 0; czr_i < czr_layers.length; czr_i++) {
            czr_drawLayer(czr_i, czr_layers[czr_i], czr_topY + czr_layerH * czr_i, czr_layerH, czr_padX, czr_layerPad);
        }

        // 连接线
        czr_drawArrows(czr_topY, czr_layerH, czr_padX);
    }

    function czr_drawLayer(czr_idx, czr_layer, czr_y, czr_h, czr_padX, czr_layerPad) {
        var czr_x = czr_padX;
        var czr_wBox = czr_w - czr_padX * 2;
        var czr_innerX = czr_x + 70;
        var czr_innerW = czr_wBox - 80;

        // 层背景
        czr_ctx.save();
        czr_ctx.fillStyle = hexA(czr_layer.color, 0.08);
        czr_ctx.strokeStyle = hexA(czr_layer.color, 0.45);
        czr_ctx.lineWidth = 1;
        roundRect(czr_x, czr_y + czr_layerPad, czr_wBox, czr_h - czr_layerPad * 2, 8);
        czr_ctx.fill();
        czr_ctx.stroke();
        czr_ctx.restore();

        // 层标签
        czr_ctx.save();
        czr_ctx.fillStyle = czr_layer.color;
        czr_ctx.beginPath();
        czr_ctx.roundRect(czr_x + 8, czr_y + czr_layerPad + 6, 54, 22, 4);
        czr_ctx.fill();
        czr_ctx.restore();

        czr_ctx.fillStyle = '#071223';
        czr_ctx.font = 'bold 12px "Microsoft YaHei"';
        czr_ctx.textAlign = 'center';
        czr_ctx.textBaseline = 'middle';
        czr_ctx.fillText(czr_layer.name, czr_x + 35, czr_y + czr_layerPad + 17);

        // 节点
        var czr_items = czr_layer.items;
        var czr_gap = 10;
        var czr_itemW = (czr_innerW - czr_gap * (czr_items.length - 1)) / czr_items.length;
        var czr_itemH = 34;
        var czr_itemY = czr_y + czr_h / 2 - czr_itemH / 2;

        for (var czr_i = 0; czr_i < czr_items.length; czr_i++) {
            var czr_ix = czr_innerX + (czr_itemW + czr_gap) * czr_i;
            czr_drawNode(czr_ix, czr_itemY, czr_itemW, czr_itemH, czr_layer.color, czr_items[czr_i]);
        }
    }

    function czr_drawNode(czr_x, czr_y, czr_w, czr_h, czr_color, czr_text) {
        czr_ctx.save();
        czr_ctx.fillStyle = hexA(czr_color, 0.25);
        czr_ctx.strokeStyle = czr_color;
        czr_ctx.lineWidth = 1.4;
        roundRect(czr_x, czr_y, czr_w, czr_h, 6);
        czr_ctx.fill();
        czr_ctx.stroke();
        czr_ctx.restore();

        czr_ctx.fillStyle = czr_color;
        czr_ctx.font = 'bold 12px "Microsoft YaHei"';
        czr_ctx.textAlign = 'center';
        czr_ctx.textBaseline = 'middle';
        czr_ctx.fillText(czr_text, czr_x + czr_w / 2, czr_y + czr_h / 2);
    }

    function czr_drawArrows(czr_topY, czr_layerH, czr_padX) {
        czr_ctx.save();
        czr_ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        czr_ctx.lineWidth = 1;
        czr_ctx.setLineDash([5, 4]);

        for (var czr_i = 0; czr_i < czr_layers.length - 1; czr_i++) {
            var czr_y1 = czr_topY + czr_layerH * (czr_i + 1) - 2;
            var czr_y2 = czr_topY + czr_layerH * (czr_i + 1) + 2;
            czr_ctx.beginPath();
            czr_ctx.moveTo(czr_w / 2 - 8, czr_y1);
            czr_ctx.lineTo(czr_w / 2 - 8, czr_y2);
            czr_ctx.stroke();
            czr_ctx.beginPath();
            czr_ctx.moveTo(czr_w / 2 + 8, czr_y1);
            czr_ctx.lineTo(czr_w / 2 + 8, czr_y2);
            czr_ctx.stroke();
        }

        // 数据流箭头（左右侧）
        czr_ctx.restore();
    }

    function hexA(czr_hex, czr_a) {
        // #rrggbb → rgba
        var czr_r = parseInt(czr_hex.substring(1, 3), 16);
        var czr_g = parseInt(czr_hex.substring(3, 5), 16);
        var czr_b = parseInt(czr_hex.substring(5, 7), 16);
        return 'rgba(' + czr_r + ',' + czr_g + ',' + czr_b + ',' + czr_a + ')';
    }

    function roundRect(czr_x, czr_y, czr_w, czr_h, czr_r) {
        czr_ctx.beginPath();
        czr_ctx.moveTo(czr_x + czr_r, czr_y);
        czr_ctx.lineTo(czr_x + czr_w - czr_r, czr_y);
        czr_ctx.quadraticCurveTo(czr_x + czr_w, czr_y, czr_x + czr_w, czr_y + czr_r);
        czr_ctx.lineTo(czr_x + czr_w, czr_y + czr_h - czr_r);
        czr_ctx.quadraticCurveTo(czr_x + czr_w, czr_y + czr_h, czr_x + czr_w - czr_r, czr_y + czr_h);
        czr_ctx.lineTo(czr_x + czr_r, czr_y + czr_h);
        czr_ctx.quadraticCurveTo(czr_x, czr_y + czr_h, czr_x, czr_y + czr_h - czr_r);
        czr_ctx.lineTo(czr_x, czr_y + czr_r);
        czr_ctx.quadraticCurveTo(czr_x, czr_y, czr_x + czr_r, czr_y);
        czr_ctx.closePath();
    }

    // 兼容 ctx.roundRect（旧浏览器）
    if (!czr_ctx.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (czr_x, czr_y, czr_w, czr_h, czr_r) {
            this.beginPath();
            this.moveTo(czr_x + czr_r, czr_y);
            this.lineTo(czr_x + czr_w - czr_r, czr_y);
            this.quadraticCurveTo(czr_x + czr_w, czr_y, czr_x + czr_w, czr_y + czr_r);
            this.lineTo(czr_x + czr_w, czr_y + czr_h - czr_r);
            this.quadraticCurveTo(czr_x + czr_w, czr_y + czr_h, czr_x + czr_w - czr_r, czr_y + czr_h);
            this.lineTo(czr_x + czr_r, czr_y + czr_h);
            this.quadraticCurveTo(czr_x, czr_y + czr_h, czr_x, czr_y + czr_h - czr_r);
            this.lineTo(czr_x, czr_y + czr_r);
            this.quadraticCurveTo(czr_x, czr_y, czr_x + czr_r, czr_y);
            this.closePath();
        };
    }

    window.addEventListener('resize', czr_resize);
    czr_resize();
</script>
</body>
</html>
