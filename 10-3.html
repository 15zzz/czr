<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈卓然 - 响应式视口</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            font-size: 14px;
            --screen-color: #e76f51;
            --text-color: #fff8ef;
            --accent-color: #243b53;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .viewport-box {
            display: grid;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            place-items: center;
            padding: 2rem;
            background-color: var(--screen-color);
            color: var(--text-color);
            text-align: center;
            transition: background-color 300ms ease;
        }

        .caption {
            max-width: 100%;
        }

        .caption h1 {
            margin: 0;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .caption p {
            margin: 1rem 0 0;
            color: var(--text-color);
            font-size: 1rem;
            line-height: 1.8;
        }

        .caption p span {
            color: var(--accent-color);
            font-weight: 700;
        }

        @media (min-width: 600px) {
            :root {
                font-size: 17px;
                --screen-color: #2a9d8f;
                --text-color: #f4f1de;
                --accent-color: #264653;
            }

            .caption h1 {
                font-size: 4.5rem;
            }
        }

        @media (min-width: 1000px) {
            :root {
                font-size: 20px;
                --screen-color: #264653;
                --text-color: #f4f1de;
                --accent-color: #e9c46a;
            }

            .caption h1 {
                font-size: 5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .viewport-box {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="viewport-box">
        <div class="caption">
            <h1>陈卓然</h1>
            <p>视口变化，字幕大小随之变化</p>
            <p><span>响应式设计</span> / CSS Media Query</p>
        </div>
    </main>

</body>
</html>
