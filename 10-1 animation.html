<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>背景颜色动画</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background-color: #f3f4f6;
			font-family: "Microsoft YaHei", sans-serif;
		}

		.box {
			width: 220px;
			height: 220px;
			display: grid;
			place-items: center;
			border-radius: 12px;
			color: #fff;
			font-size: 24px;
			animation: change-color 8s infinite;
		}

		@keyframes change-color {
			0%, 100% {
				background-color: #e74c3c;
			}
			25% {
				background-color: #f1c40f;
			}
			50% {
				background-color: #3498db;
			}
			75% {
				background-color: #2ecc71;
			}
		}
	</style>
</head>
<body>
<!-- 姓名：陈卓然，日期：2026-10-22，功能名称：CSS 背景颜色动画 -->
	<div class="box">颜色变化</div>
    <a class="chen_home" href="./index.html" style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-block;padding:10px 18px;border-radius:40px;background:#145a8d;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;font-family:'Microsoft YaHei','PingFang SC',sans-serif;box-shadow:0 8px 18px rgba(0,0,0,0.25);">← 返回首页</a>
</body>
</html>
