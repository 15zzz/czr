<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .title{            
            width: 500px;   
            height: 33px;
            line-height: 33px;
            margin-left: 20px;
            margin-top: 30px;
            margin-bottom: 30px;     
        }
        .title h2{
            font-size:14px;
            padding-left: 10px;
        }
        .title a{
            font-size:12px;
            color: #999;
            text-decoration: none;
            margin-left: 16px;
        }
        .title:first-child{
            display: flex;
            justify-content: space-between;
            border: 1px solid #ccc;
        }
        .title:nth-child(2){
            display: flex;
            border-bottom: 1px solid #ccc;
        }
        .title:nth-child(2) h2{
            flex-grow:1;
        }
        .title:nth-child(3){
            position: relative;
            border-bottom: 1px solid #ccc;
        }
        .title:nth-child(3) a{
            position: absolute;
            right: 10px;
            top: 0;
        }
    </style>
</head>
<body>
